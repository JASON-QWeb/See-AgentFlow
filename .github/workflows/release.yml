name: Release

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

jobs:
  preflight:
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag matches the App version, has notes and is on main
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^VERSION = '${version}'\$" macos/build.py || { echo "macos/build.py is not version ${version}"; exit 1; }
          test -s "docs/release-notes/${GITHUB_REF_NAME}.md" || { echo "docs/release-notes/${GITHUB_REF_NAME}.md is missing"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "${GITHUB_REF_NAME} is not on main"; exit 1; }

  verify:
    needs: preflight
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish the verified DMG
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The image that passed verification is what ships. It is not rebuilt here.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dmg
          path: release
      - name: Confirm the checksum survived the transfer
        working-directory: release
        run: sha256sum -c ./*.sha256
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --latest \
            --title "See-AgentFlow ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/release-notes/${GITHUB_REF_NAME}.md"
